# /etc/nginx/snippets/sloperator-bridge.conf — included from the :443 server of
# /etc/nginx/sites-available/muse-slop. Only the WORKER half of the relay is public; the
# agent API (/v1/jobs, /v1/call, /v1/status) stays on 127.0.0.1:8095 for local processes.
location /bridge/v1/worker/ {
    proxy_pass http://127.0.0.1:8095/v1/worker/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 40m;      # a 20 MB upstream body grows ~1.34x in base64
    access_log /var/log/nginx/sloperator-bridge.access.log;
}

location /bridge/ {
    return 404;
}
